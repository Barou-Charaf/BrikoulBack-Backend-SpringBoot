<!DOCTYPE html><html class="light" lang="fr"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>E-Samsar | Chargement</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.2; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
        .loading-bar-animation {
            animation: slide 1.5s infinite ease-in-out;
        }
        @keyframes slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }
        .splash-gradient {
            background: linear-gradient(135deg, #00535b 0%, #002d32 100%);
        }
    </style>

          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-background": "#181c1d",
                      "on-secondary-fixed": "#2c1700",
                      "error": "#ba1a1a",
                      "secondary-fixed": "#ffdcbc",
                      "on-error": "#ffffff",
                      "inverse-primary": "#82d3de",
                      "secondary-container": "#fd9d1a",
                      "surface": "#f7fafa",
                      "on-surface-variant": "#3e494a",
                      "on-secondary-container": "#663b00",
                      "secondary": "#895100",
                      "on-tertiary-container": "#ffd7bd",
                      "primary-fixed": "#9ff0fb",
                      "outline": "#6f797a",
                      "inverse-on-surface": "#eef1f2",
                      "on-secondary": "#ffffff",
                      "primary-container": "#006d77",
                      "surface-bright": "#f7fafa",
                      "surface-tint": "#006972",
                      "tertiary-fixed": "#ffdcc5",

                      "on-primary": "#ffffff",
                      "error-container": "#ffdad6",
                      "on-error-container": "#93000a",
                      "primary-fixed-dim": "#82d3de",
                      "secondary-fixed-dim": "#ffb86b",
                      "surface-container-low": "#f1f4f4",
                      "surface-container-high": "#e6e9e9",
                      "surface-container": "#ebeeef",
                      "inverse-surface": "#2d3132",
                      "on-tertiary-fixed": "#301400",
                      "surface-dim": "#d7dadb",
                      "tertiary": "#713d10",
                      "surface-variant": "#e0e3e3",
                      "on-tertiary-fixed-variant": "#6d390c",
                      "surface-container-highest": "#e0e3e3",
                      "primary": "#00535b",
                      "outline-variant": "#bec8ca",
                      "on-tertiary": "#ffffff",

<body class="bg-background text-on-background antialiased overflow-hidden">
<main class="relative h-screen w-full splash-gradient flex flex-col items-center justify-between py-16 overflow-hidden">
<!-- Background Atmospheric Element -->
<div class="absolute inset-0 pointer-events-none overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[50%] h-[50%] bg-primary-container/20 blur-[120px] rounded-full"></div>
<div class="absolute top-[40%] -right-[20%] w-[60%] h-[60%] bg-secondary-container/5 blur-[150px] rounded-full"></div>
<!-- Subtle Grid Pattern -->
<div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 40px 40px;"></div>
</div>
<!-- Spacer for top -->
<div></div>
<!-- Central Branding Anchor -->
<div class="relative flex flex-col items-center z-10 scale-100 transition-transform duration-700 ease-out" id="logo-container">
<!-- Icon with pulse effect -->
<div class="relative mb-8">
<div class="absolute inset-0 bg-white/20 rounded-3xl blur-2xl animate-[pulse-ring_3s_infinite]"></div>
<div class="relative bg-white p-6 rounded-[2rem] shadow-2xl flex items-center justify-center transform hover:rotate-3 transition-transform duration-500">
<span class="material-symbols-outlined text-primary text-[64px]" style="font-variation-settings: 'FILL' 1;">
                        local_shipping
                    </span>
</div>
</div>
<!-- Brand Text -->
<h1 class="font-headline-lg text-white text-[42px] tracking-tight mb-2">
                E-Samsar
            </h1>
<p class="font-label-md text-primary-fixed/60 uppercase tracking-[0.2em]">
                Logistique Marocaine Premium
            </p>
</div>
<!-- Bottom Loading Section -->
<div class="w-full max-w-[280px] flex flex-col items-center gap-6 z-10 px-container-padding">
<div class="flex flex-col items-center gap-3">
<span class="font-label-md text-white/80">Chargement...</span>
<!-- Modern Progress Indicator -->
<div class="w-full h-[3px] bg-white/10 rounded-full overflow-hidden relative">
<div class="absolute inset-0 w-1/3 bg-primary-fixed-dim rounded-full loading-bar-animation shadow-[0_0_8px_#82d3de]"></div>
</div>
</div>
<!-- Identity Footer -->
<div class="flex items-center gap-2 mt-4 opacity-50">
<span class="material-symbols-outlined text-white text-sm">verified_user</span>
<span class="font-label-md text-white text-[10px] uppercase tracking-widest">Sécurisé par E-Samsar Tech</span>
</div>
</div>
<!-- Visual Decorative Elements (Truck Motion Blur Effect) -->
<div class="absolute bottom-[20%] left-[-100px] opacity-10 blur-sm transform -rotate-12 pointer-events-none">
<span class="material-symbols-outlined text-white text-[200px]">local_shipping</span>
</div>
</main>
<script>
        // Micro-interactions and Entry Animation
        document.addEventListener('DOMContentLoaded', () => {
            const logoContainer = document.getElementById('logo-container');
            
            // Initial scale in
            logoContainer.style.opacity = '0';
            logoContainer.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                logoContainer.style.transition = 'all 1s cubic-bezier(0.34, 1.56, 0.64, 1)';
                logoContainer.style.opacity = '1';
                logoContainer.style.transform = 'scale(1) translateY(0)';
            }, 300);

            // Simulation of loading progress (Purely visual)
            let progress = 0;
            const updateProgress = () => {
                if(progress < 100) {
                    progress += Math.random() * 5;
                    // In a real app, this would trigger navigation once at 100
                }
            };
            setInterval(updateProgress, 200);
        });
    </script>
</body></html>
