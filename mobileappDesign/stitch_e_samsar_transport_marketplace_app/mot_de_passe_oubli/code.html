<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md">
<!-- Top App Bar (Simplified for transactional screen) -->
<header class="fixed top-0 w-full z-50 bg-surface flex justify-between items-center px-container-padding h-16 w-full shadow-sm">
<button aria-label="Retour" class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-surface-container-low transition-colors active:scale-95" onclick="window.history.back()">

</button>
<span class="font-headline-sm text-headline-sm text-primary font-bold">E-Samsar</span>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-grow flex flex-col items-center justify-center px-container-padding pt-16 pb-8">
<div class="w-full max-w-md bg-surface-container-lowest p-8 rounded-xl border border-outline-variant shadow-[0_2px_8px_rgba(0,0,0,0.04)]">
<!-- Branding/Icon Section -->
<div class="flex flex-col items-center mb-section-gap">
<div class="w-20 h-20 bg-primary/5 flex items-center justify-center rounded-full mb-stack-gap">
<span class="material-symbols-outlined text-primary text-[48px]" style="font-variation-settings: 'FILL' 1;">lock_person</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface text-center">Mot de passe oublié</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-2 max-w-[280px]">
                    Saisissez votre e-mail pour recevoir un lien de réinitialisation sécurisé.
                </p>
</div>
<!-- Form Section -->
<form class="flex flex-col gap-section-gap" id="resetForm" onsubmit="handleReset(event)">
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface-variant ml-1" for="email">Adresse e-mail</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-4 text-outline">mail</span>
<input class="w-full h-12 pl-12 pr-4 bg-surface border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="email" name="email" placeholder="nom@exemple.com" required="" type="email"/>
</div>
</div>
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm text-headline-sm rounded-xl shadow-sm hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span>Envoyer le lien de réinitialisation</span>
<span class="material-symbols-outlined">send</span>
</button>
</form>
<!-- Success State (Hidden by default) -->
<div class="hidden flex flex-col items-center text-center animate-in fade-in slide-in-from-bottom-4 duration-500" id="successMessage">
<div class="w-16 h-16 bg-secondary-container/20 text-secondary flex items-center justify-center rounded-full mb-4">
<span class="material-symbols-outlined text-[32px]">mark_email_read</span>
</div>
<p class="font-body-lg text-body-lg text-on-surface mb-6">
                    Si cet e-mail existe, un lien de réinitialisation a été envoyé.
                </p>
<div class="w-full h-[1px] bg-outline-variant mb-6"></div>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Vous n'avez rien reçu ? Vérifiez vos spams ou <button class="text-primary font-semibold hover:underline" onclick="location.reload()">réessayez</button>.
                </p>
</div>
<!-- Footer Action -->
<div class="mt-section-gap text-center" id="footerLinks">
<a class="font-label-md text-label-md text-primary font-bold flex items-center justify-center gap-1 hover:opacity-70 transition-opacity" href="#">
<span class="material-symbols-outlined text-[18px]">chevron_left</span>
                    Retour à la connexion
                </a>
</div>
</div>

<script>
        function handleReset(event) {
            event.preventDefault();
            const form = document.getElementById('resetForm');
            const success = document.getElementById('successMessage');
            const header = document.querySelector('h1').parentElement;
            
            // Artificial delay to simulate network
            const submitBtn = form.querySelector('button');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';

            setTimeout(() => {
                form.classList.add('hidden');
                header.classList.add('hidden');
                success.classList.remove('hidden');
            }, 1200);
        }

        // Ripple Effect for button
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                let ripples = document.createElement('span');
                ripples.style.left = x + 'px';
                ripples.style.top = y + 'px';
                this.appendChild(ripples);
                setTimeout(() => { ripples.remove() }, 1000);
            });
        });
    </script>
